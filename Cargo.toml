[package]
name = "particle"
version = "0.1.0"
edition = "2024"

[dependencies]
elemental = { git = "https://github.com/ElectronicWave/Elemental", branch = "main", package = "elemental-kit", default-features = false, features = [
    "launcher",
    "shared-toml",
] }
anyhow = "1.0.102"
color-eyre = "0.6.5"
ratail = { git = "https://github.com/ElectronicWave/ratail" }
ratatui = "0.30.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1"
tokio = { version = "1.52.1", features = ["macros", "process", "rt-multi-thread"] }
sys-locale = "0.3.2"
unicode-width = "0.2"

[profile.release]
codegen-units = 1           # reduces binary size by ~2%
debug = "full"              # keeps release artifacts debuggable
lto = true                  # reduces binary size by ~14%
opt-level = "z"             # minimizes binary size
panic = "abort"             # reduces binary size when combined with panic_immediate_abort
split-debuginfo = "packed"  # emits a separate *.dwp/*.dSYM so the binary can be stripped
strip = "symbols"           # see split-debuginfo; drops symbols from the executable
incremental = true         # lets LTO optimize across the whole program
